[package]
name = "aroko-windows"
version = "0.1.0"
edition = "2021"

[dependencies]
aroko-core = { path = "../aroko-core" }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
lucide-icons = "1.57.0"
